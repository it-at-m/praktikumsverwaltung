
modules:
  frontend:
    image:
      registry: ghcr.io
      repository: it-at-m/praktikumsverwaltung/frontend
      tag: dev
      pullPolicy: Always

    replicas: 1

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

    service:
      http: true

  backend:
    image:
      registry: ghcr.io
      repository: it-at-m/praktikumsverwaltung/backend
      tag: dev
      pullPolicy: Always

    replicas: 1

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

    service:
      http: true

    env:
      - name: SERVER_PORT
        value: "8080"
      - name: SPRING_PROFILES_ACTIVE
        value: "local"
      - name: SSO_URL
        value: "http://keycloak:8080"
      - name: SSO_REALM
        value: "local_realm"
      - name: SSO_CLIENT
        value: "local"

refarch-gateway:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  applicationYML:
    spring:
      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: http://keycloak:8080/auth/realms/local_realm/protocol/openid-connect/certs

          client:
            registration:
              keycloak:
                provider: keycloak
                client-id: local
                client-secret: client_secret
                authorization-grant-type: authorization_code
                scope: openid

            provider:
              keycloak:
                issuer-uri: https://keycloak-refarch-example.apps.test.capk.muenchen.de/auth/realms/local_realm

  volumes:
    - name: cacerts-volume
      secret:
        secretName: cacerts-lhm
        items:
          - key: cacerts-lhm
            path: cacerts

  volumeMounts:
    - name: cacerts-volume
      mountPath: /etc/pki/ca-trust/extracted/java
      readOnly: true

  envAppend:
    - name: JAVA_OPTS_APPEND
      value: >-
        -Djavax.net.ssl.trustStore=/etc/pki/ca-trust/extracted/java/cacerts
        -Djavax.net.ssl.trustStorePassword=changeit
