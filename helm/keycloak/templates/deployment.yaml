
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak

spec:
  replicas: 1

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      labels:
        app: keycloak

    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          args:
            - start-dev
            - --http-relative-path=/auth

          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: admin

            - name: JAVA_OPTS_KC_HEAP
              value: "-XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=50"

            - name: KC_PROXY_HEADERS
              value: xforwarded

            - name: KC_HOSTNAME
              value: "https://keycloak-refarch-example.apps.test.capk.muenchen.de/auth"

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 1Gi

          readinessProbe:
            httpGet:
              path: /auth/realms/master
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
